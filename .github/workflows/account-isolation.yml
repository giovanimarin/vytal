name: Account isolation regression

on:
  pull_request:
  push:
    branches: [fix/pkg-01-account-isolation-clean, fix/pkg-02-session-refresh, 'codex/**', master]

permissions:
  contents: read

jobs:
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-prod.txt
        shell: powershell
      - name: Launcher regressions on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/windows-launcher.tests.ps1
      - name: Launcher regressions on PowerShell 7
        shell: pwsh
        run: ./tests/windows-launcher.tests.ps1
      - name: Windows real backend persistence and restart (synthetic data)
        shell: powershell
        run: ./tests/windows-backend-smoke.ps1

  backend-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt ruff==0.17.3
      - name: Unit and real API account isolation regressions
        working-directory: backend
        run: pytest --cov=app --cov-report=term --cov-fail-under=30 --junitxml=test-results.xml
        env:
          ENVIRONMENT: test
          GOOGLE_CLIENT_ID: synthetic-ci
          GOOGLE_CLIENT_SECRET: synthetic-ci
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Terraform syntax and format only (no init or provider calls)
        run: terraform fmt -check -recursive infrastructure/terraform
      - name: Offline readiness evidence (not deployment approval)
        run: python backend/scripts/readiness_audit.py > backend/readiness-report.json
      - name: Public v1 OpenAPI compatibility
        run: python backend/scripts/check_v1_contract.py --base origin/master --snapshot backend/tests/baseline/fixtures/openapi-v1.json --allow-additions
      - name: Lint authentication Python files
        run: >-
          ruff check --select E4,E7,E9,F,I,UP,B,SIM,C4,RUF,BLE
          backend/app/health_connect backend/app/api/v1/health_connect.py
          backend/app/api/v1/router.py backend/tests/unit/health_connect
          backend/app/auth/authorization.py backend/app/auth/dependencies.py
          backend/app/main.py backend/app/services/oauth_service.py
          backend/app/api/v1/connect.py backend/app/api/v1/health_data.py
          backend/app/api/v1/readiness.py backend/app/api/v1/modality_readiness.py
          backend/app/api/v1/muscles.py backend/app/api/v1/workouts.py
          backend/app/api/v1/wellness_feedback.py backend/tests/api backend/tests/unit/auth
          backend/scripts/check_v1_contract.py backend/scripts/readiness_audit.py
          backend/scripts/sqlite_contract.py backend/tests/baseline backend/tests/unit/contracts
          backend/tests/unit/readiness backend/app/repositories/token_repo.py
          backend/app/adapters/cloud/base.py backend/app/adapters/cloud/local.py
          backend/app/adapters/cloud/gcp.py backend/app/repositories/refresh_token_repo.py
          backend/app/services/auth_service.py
          backend/app/config/security.py backend/app/config/settings.py
          backend/app/config/cloud_config.py backend/app/config/safe_logging.py
          backend/app/auth/jwt_handler.py backend/app/adapters/connectors/google_fit.py
          backend/app/api/v1/dev_seed.py backend/tests/unit/config backend/tests/conftest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-regression-results
          path: |
            backend/test-results.xml
            backend/readiness-report.json

  android-regression:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/vytal-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/vytal-app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r ../../backend/requirements.txt
      - run: npm ci --legacy-peer-deps
      - run: npm run test:api
        env:
          VYTAL_PYTHON: python
      - run: npm test
      - run: npm run lint:pkg01
      - run: npm run typecheck
      - name: Development APK runtime API address (real Metro, synthetic LAN)
        run: node --test tests/launcher-metro.test.cjs
      - name: Build Android Hermes bundle
        run: npm run build:android
        env:
          NODE_ENV: production
          EXPO_PUBLIC_API_URL: https://api.example.invalid/api/v1
          CI: '1'
          EXPO_NO_TELEMETRY: '1'


      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - name: Native Health Connect development project and manifest
        run: |
          npx expo prebuild --platform android --no-install
          node tests/health-connect-manifest.cjs
        env:
          NODE_ENV: development
          EXPO_PUBLIC_API_URL: http://10.0.2.2:8000/api/v1
          EXPO_OFFLINE: '1'
          EXPO_NO_TELEMETRY: '1'
      - name: Compile development APK (no device, no EAS or deploy)
        working-directory: mobile/vytal-app/android
        run: |
          if ! ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2 > /tmp/vytal-native-build.log 2>&1; then
            tail -n 120 /tmp/vytal-native-build.log
            python - <<'PYCODE'
          import pathlib
          lines=pathlib.Path('/tmp/vytal-native-build.log').read_text(errors='replace').splitlines()
          errors=[line for line in lines if any(key in line for key in ['What went wrong', 'error:', 'Could not', 'Exception', 'failed'])]
          text=' | '.join(errors[-12:])[:3000].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::error::Native APK compilation failed: '+text)
          PYCODE
            exit 1
          fi
        env:
          NODE_ENV: development
          EXPO_PUBLIC_API_URL: http://10.0.2.2:8000/api/v1
          EXPO_OFFLINE: '1'
          EXPO_NO_TELEMETRY: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: android-health-connect-debug-apk
          path: mobile/vytal-app/android/app/build/outputs/apk/debug/*.apk


  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node --check tests/auth.test.cjs && node --check tests/config.test.cjs && node --check config/security.js && node --check next.config.js
      - run: npx tsc --noEmit --incremental false
      - run: npm run build
        env:
          VYTAL_BACKEND_URL: https://backend.example.invalid
          NEXT_TELEMETRY_DISABLED: '1'
